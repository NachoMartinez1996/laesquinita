        document.getElementById('cargarBtn').addEventListener('click', async () => {
            addLog('⏳ Creando categorías...');
            const snapshot = await get(categoriesRef);
            if (!snapshot.exists()) {
                for (const nombre of categoriasNombres) {
                    const nuevaRef = push(categoriesRef);
                    await set(nuevaRef, { nombre });
                    addLog(`✅ Categoría creada: ${nombre}`);
                }
            } else {
                addLog('ℹ️ Las categorías ya existen, no se modifican.');
            }

            // Obtener categorías con sus IDs
            const catsSnap = await get(categoriesRef);
            const catsData = catsSnap.val();
            const catMap = {};
            for (const [id, obj] of Object.entries(catsData)) {
                catMap[obj.nombre] = id;
            }

            const productos = obtenerProductos();
            addLog(`📦 Subiendo ${productos.length} productos...`);
            for (const prod of productos) {
                const catId = catMap[prod.categoria];
                if (!catId) {
                    addLog(`⚠️ Categoría no encontrada para "${prod.nombre}" – se asigna a "Otros"`);
                }
                const productData = {
                    codigo: '', // sin código de barras por ahora
                    nombre: prod.nombre,
                    categoriaId: catId || catMap["Otros"],
                    fechaIngreso: new Date().toISOString().slice(0, 10),
                    cantidad: prod.cantidad,
                    precioCosto: prod.precioCosto,
                    porcentajeGanancia: prod.porcentajeGanancia,
                    precioTotal: (prod.precioCosto * (1 + prod.porcentajeGanancia / 100)).toFixed(2)
                };
                const newRef = push(productsRef);
                await set(newRef, productData);
                addLog(`➕ ${prod.nombre} (${prod.cantidad} u.)`);
            }
            addLog('✅ ¡Inventario cargado exitosamente! Ya podés usar la app.');
        });
